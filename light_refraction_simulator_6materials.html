<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光の屈折シミュレーター</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#18263a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 7px}.sub{color:#566579;margin:0 0 18px}.layout{display:grid;grid-template-columns:290px 1fr;gap:16px}.panel{background:white;border:1px solid #dce3eb;border-radius:16px;padding:18px;box-shadow:0 3px 15px #14283b0a}label{font-weight:700;display:block;margin:15px 0 6px}select,input[type=range]{width:100%}select{padding:11px;border:1px solid #b9c5d4;border-radius:9px;font-size:16px;background:white}input[type=range]{accent-color:#2563eb;touch-action:pan-y}.angle{font-size:25px;font-weight:800;color:#1d4ed8}.checks label{font-weight:500;display:flex;align-items:center;gap:9px;margin:12px 0}.checks input{width:19px;height:19px}button{border:1px solid #b8c7d8;border-radius:10px;background:#f7fafc;padding:10px 12px;font-size:15px;cursor:pointer}button:active{background:#dbeafe}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}canvas{width:100%;height:auto;display:block;border-radius:12px;background:#f8fbff;touch-action:none}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{border-radius:10px;background:#f2f6fb;padding:12px;text-align:center}.metric small{display:block;color:#526176}.metric strong{font-size:22px}.note{margin-top:12px;padding:12px;background:#f7f9fc;border-radius:10px;line-height:1.7}.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px;font-size:14px}.dot{display:inline-block;width:20px;height:4px;vertical-align:middle;margin-right:5px}.foot{margin-top:15px;color:#5c6877;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:13px}.readout{gap:5px}.metric{padding:9px 3px}.metric strong{font-size:18px}}
</style></head><body><main class="wrap"><h1>光の屈折シミュレーター</h1><p class="sub">物質と入射角を変えて、光の進み方を調べよう。</p><div class="layout"><section class="panel"><label for="from">光が進んでくる物質</label><select id="from"><option value="air">空気</option><option value="water">水</option><option value="glass">ガラス</option><option value="oil">油</option><option value="sapphire">サファイア</option><option value="diamond">ダイヤモンド</option></select><label for="to">光が進む先の物質</label><select id="to"><option value="water">水</option><option value="air">空気</option><option value="glass">ガラス</option><option value="oil">油</option><option value="sapphire">サファイア</option><option value="diamond">ダイヤモンド</option></select><label for="angle">入射角（法線から測る）</label><div class="angle"><span id="angleValue">40</span>°</div><input id="angle" type="range" min="0" max="89" step="1" value="40"><div class="buttons"><button id="swap" type="button">物質を入れ替える</button><button id="reset" type="button">初期状態に戻す</button></div><div class="checks"><label><input id="showAngles" type="checkbox" checked>角度を表示する</label><label><input id="showNormal" type="checkbox" checked>法線を表示する</label><label><input id="showReflection" type="checkbox" checked>反射光を表示する</label><label><input id="showFormula" type="checkbox">計算式を表示する</label></div></section><section class="panel"><canvas id="scene" width="760" height="540" aria-label="光の入射・屈折・反射を示す図"></canvas><div class="legend"><span><i class="dot" style="background:#e14a36"></i>入射光</span><span><i class="dot" style="background:#1268db"></i>屈折光</span><span><i class="dot" style="background:#df9a1d"></i>反射光</span><span><i class="dot" style="background:#607086"></i>法線</span></div><div class="readout"><div class="metric"><small>入射角</small><strong id="incidence">40°</strong></div><div class="metric"><small>屈折角</small><strong id="refracted">—</strong></div><div class="metric"><small>反射角</small><strong id="reflected">40°</strong></div></div><div class="note" id="explanation" aria-live="polite"></div><div class="note" id="formula" style="display:none"></div></section></div><p class="foot">※ 屈折率は代表的な近似値（空気 1.00、水 1.33、ガラス 1.50、油 1.47、サファイア 1.77、ダイヤモンド 2.42）を使用。光は単色光として扱います。図の反射光の強さは実際の反射率を表していません。</p></main><script>
(()=>{'use strict';const materials={air:{name:'空気',n:1,color:'#f0f7ff'},water:{name:'水',n:1.33,color:'#d8f0ff'},glass:{name:'ガラス',n:1.50,color:'#dce7f4'},oil:{name:'油',n:1.47,color:'#fff1c9'},sapphire:{name:'サファイア',n:1.77,color:'#e0e4ff'},diamond:{name:'ダイヤモンド',n:2.42,color:'#e8f9f4'}};const $=id=>document.getElementById(id);const cv=$('scene'),ctx=cv.getContext('2d');let dragging=false;const rad=Math.PI/180;function line(x1,y1,x2,y2,color,width=4,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}function arrow(x1,y1,x2,y2,color,width=5){line(x1,y1,x2,y2,color,width);const t=Math.atan2(y2-y1,x2-x1),a=14;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-a*Math.cos(t-.43),y2-a*Math.sin(t-.43));ctx.lineTo(x2-a*Math.cos(t+.43),y2-a*Math.sin(t+.43));ctx.closePath();ctx.fillStyle=color;ctx.fill()}function label(t,x,y,color='#25364b',size=20){ctx.font=`700 ${size}px system-ui,sans-serif`;ctx.fillStyle=color;ctx.fillText(t,x,y)}function arc(cx,cy,r,start,end,color){ctx.beginPath();ctx.arc(cx,cy,r,start,end,false);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}function draw(){const a=+$('angle').value,first=materials[$('from').value],second=materials[$('to').value],si=first.n/second.n*Math.sin(a*rad),tir=si>1+1e-12,b=tir?null:Math.asin(Math.min(1,si))/rad;const x=380,y=270,L=300;ctx.clearRect(0,0,760,540);ctx.fillStyle=first.color;ctx.fillRect(0,0,760,y);ctx.fillStyle=second.color;ctx.fillRect(0,y,760,270);line(0,y,760,y,'#52677c',2);if($('showNormal').checked)line(x,15,x,525,'#738398',2,[9,7]);label(first.name,25,42,'#41576f',23);label(second.name,25,310,'#41576f',23);label(`n = ${first.n.toFixed(2)}`,25,70,'#62768a',17);label(`n = ${second.n.toFixed(2)}`,25,337,'#62768a',17);const t=a*rad;const ix=x-L*Math.sin(t),iy=y-L*Math.cos(t);arrow(ix,iy,x,y,'#e14a36',5);if($('showReflection').checked){const rx=x+L*Math.sin(t),ry=y-L*Math.cos(t);arrow(x,y,rx,ry,'#df9a1d',4)}if(!tir){const u=b*rad,tx=x+L*Math.sin(u),ty=y+L*Math.cos(u);arrow(x,y,tx,ty,'#1268db',5)}ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle='#26384c';ctx.fill();if($('showAngles').checked){if(a>0){arc(x,y,70,-Math.PI/2-t,-Math.PI/2,'#e14a36');label(`${a}°`,x-112,y-95,'#b63628',18);if($('showReflection').checked){arc(x,y,95,-Math.PI/2,-Math.PI/2+t,'#df9a1d');label(`${a}°`,x+64,y-105,'#a66c0d',18)}}if(!tir&&b>0){arc(x,y,76,Math.PI/2-b*rad,Math.PI/2,'#1268db');label(`${b.toFixed(1)}°`,x+17,y+107,'#1258b6',18)}}$('angleValue').textContent=a;$('incidence').textContent=a+'°';$('refracted').textContent=tir?'全反射':b.toFixed(1)+'°';$('reflected').textContent=a+'°';let msg;if(tir){const critical=Math.asin(second.n/first.n)/rad;msg=`全反射が起きています。${first.name}から${second.name}へ進む光は、入射角が臨界角（約${critical.toFixed(1)}°）を超えると屈折光がなくなります。`}else if(a===0){msg='光が境界面に垂直に入ると、進む向きは変わりません。'}else if(first.n<second.n){msg=`${first.name}から${second.name}へ進むと、光は法線に近づく向きに屈折します。`}else if(first.n>second.n){msg=`${first.name}から${second.name}へ進むと、光は法線から遠ざかる向きに屈折します。`}else{msg='両側の屈折率が同じなので、光は曲がらずに進みます。'}$('explanation').textContent=msg;const f=$('formula');f.style.display=$('showFormula').checked?'block':'none';f.textContent=`スネルの法則：n₁ sin θ₁ = n₂ sin θ₂\n${first.n.toFixed(2)} × sin(${a}°) = ${second.n.toFixed(2)} × sin(屈折角)${tir?'（全反射のため屈折角なし）':` → 屈折角 ≈ ${b.toFixed(1)}°`}`;f.style.whiteSpace='pre-line'}['from','to','angle','showAngles','showNormal','showReflection','showFormula'].forEach(id=>$(id).addEventListener('input',draw));$('swap').addEventListener('click',()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;draw()});$('reset').addEventListener('click',()=>{$('from').value='air';$('to').value='water';$('angle').value=40;$('showAngles').checked=true;$('showNormal').checked=true;$('showReflection').checked=true;$('showFormula').checked=false;draw()});function pointer(e){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height;if(py>270)return;const angle=Math.atan2(Math.abs(px-380),Math.max(0,270-py))/rad;$('angle').value=Math.round(Math.min(89,angle));draw()}cv.addEventListener('pointerdown',e=>{dragging=true;cv.setPointerCapture(e.pointerId);pointer(e)});cv.addEventListener('pointermove',e=>{if(dragging)pointer(e)});cv.addEventListener('pointerup',()=>dragging=false);cv.addEventListener('pointercancel',()=>dragging=false);draw()})();
</script></body></html>
